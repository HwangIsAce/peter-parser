[project]
name = "peter-parser"
version = "0.1.0"
description = "Production document processing pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "langgraph>=1.0.7",
    "python-dotenv>=1.2.1",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "instructor>=1.14.4",
    "nest-asyncio>=1.6.0",
    "peter-parser-core",
    "gremlinpython>=3.7.3",
    "redis>=5.0.0",
    "rq>=1.15.0",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.4.9",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.0.0",
]
docs = [
    "reportlab>=4.0.0",
]
optimizer = [
    "llm-chunker-optimizer",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/peter_parser"]

[tool.uv.sources]
peter-parser-core = { path = "../peter-parser-core" }
llm-chunker-optimizer = { path = "../../../modules/llm-chunker-optimizer" }
